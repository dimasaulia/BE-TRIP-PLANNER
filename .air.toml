root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
bin = "./tmp/api"
delay = 1000
exclude_dir = ["tmp", "vendor", "logs"]
exclude_file = []
exclude_regex = ["_test.go"]
include_ext = ["go", "tpl", "tmpl", "html", "json"]
kill_delay = "500ms"
log = "air-build.log"
send_interrupt = true
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
